name: pmd

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  pmd-code-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Run PMD
        id: pmd
        uses: pmd/pmd-github-action@v2        # ← tag en vez del commit SHA
        with:
          version: '7.13.0'                   # ← versión fija, no "latest"
          rulesets: 'pmd/apex-ruleset.xml'    # ← tu ruleset de Apex
          sourcePath: 'force-app'             # ← tu carpeta Apex, no src/main/java
          analyzeModifiedFilesOnly: false

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: pmd-report.sarif